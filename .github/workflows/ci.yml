name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: Dependency check
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Coverage summary
        run: go test ./... -coverprofile=/tmp/cover.out >/dev/null && go tool cover -func=/tmp/cover.out | tail -1

  # Control-plane smoke on real PostgreSQL/MySQL: full AutoMigrate + seed
  # (unit tests are SQLite-only by design; this guards dialect support).
  backend-db-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mailez
          POSTGRES_USER: mailez
          POSTGRES_PASSWORD: mailez
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailez -d mailez"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mailez-root
          MYSQL_DATABASE: mailez
          MYSQL_USER: mailez
          MYSQL_PASSWORD: mailez
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -umailez -pmailez"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Seed (PostgreSQL)
        run: go run ./cmd/seed
        env:
          DB_DRIVER: postgres
          DB_DSN: postgres://mailez:mailez@127.0.0.1:5432/mailez?sslmode=disable
      - name: Seed (MySQL)
        run: go run ./cmd/seed
        env:
          DB_DRIVER: mysql
          DB_DSN: mailez:mailez@tcp(127.0.0.1:3306)/mailez?charset=utf8mb4&parseTime=True&loc=Local

  frontend-webmail:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/apps/webmail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  frontend-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
