name: release-private

# PRIVATE TREE ONLY. This file lives in the internal repository and is never
# exported to the public source tree. On v* tags it:
#   1. builds and pushes all mailez images via docker buildx bake
#      (group "default" -> public ghcr.io/mailez-hq/mailez-*,
#       group "ee" -> private ghcr.io/mailez-hq/mailez-*-ee),
#   2. boots the community stack FROM THE PUBLISHED IMAGES and smoke-tests
#      health + seed + SSO login,
#   3. packs the install tarball (scripts/make-release.sh) and attaches it
#      to the GitHub release.
#
# The mailezine engine images are NOT built here (no sibling checkout in
# this repo): mailez-hq/mailezine's own release workflow publishes
# ghcr.io/mailez-hq/mailez-mailezine[-ee]:<tag> in lockstep. Tag mailezine
# first, then this repo; the smoke job retries the pull accordingly.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [default, ee]
    steps:
      - uses: actions/checkout@v4
      # The EE backend verifies licenses against the vendor key baked in at
      # build time; without the secrets the image would ship with the dev
      # key and refuse MAILEZ_LICENSE_REQUIRED=true at startup. Fail here,
      # at release time, instead of at the customer.
      - name: Require the vendor license keys for EE builds
        if: matrix.group == 'ee'
        env:
          MAILEZ_LICENSE_PUBKEY: ${{ secrets.MAILEZ_LICENSE_PUBKEY }}
          MAILEZ_SERVICE_PUBKEY: ${{ secrets.MAILEZ_SERVICE_PUBKEY }}
        run: |
          if [ -z "$MAILEZ_LICENSE_PUBKEY" ] || [ -z "$MAILEZ_SERVICE_PUBKEY" ]; then
            echo "::error::EE releases require the MAILEZ_LICENSE_PUBKEY and MAILEZ_SERVICE_PUBKEY repo secrets (go run ./cmd/license genkey once, keep the private half in the secret store; see internal docs)"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker-bake.hcl + docker-bake.ee.hcl variables (VERSION/PLATFORMS/
      # APK_MIRROR/MAILEZ_LICENSE_PUBKEY/MAILEZ_SERVICE_PUBKEY) are
      # overridden by same-name environment variables. GH runners live
      # outside CN, so use the upstream Alpine CDN instead of the HCL's
      # aliyun default. The default-group job ignores the EE file's targets.
      - uses: docker/bake-action@v6
        env:
          VERSION: ${{ github.ref_name }}
          PLATFORMS: linux/amd64,linux/arm64
          APK_MIRROR: dl-cdn.alpinelinux.org
          MAILEZ_LICENSE_PUBKEY: ${{ secrets.MAILEZ_LICENSE_PUBKEY }}
          MAILEZ_SERVICE_PUBKEY: ${{ secrets.MAILEZ_SERVICE_PUBKEY }}
        with:
          files: |
            docker-bake.hcl
            docker-bake.ee.hcl
          targets: ${{ matrix.group }}
          push: true
          set: |
            *.cache-from=type=gha,scope=release-${{ matrix.group }}
            *.cache-to=type=gha,scope=release-${{ matrix.group }},mode=max

  smoke:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Boot the community stack from published images
        working-directory: deploy
        env:
          # Shell env beats --env-file, so this pins the freshly pushed tag.
          MAILEZ_IMAGE_TAG: ${{ github.ref_name }}
        run: |
          cp mailez.env.example mailez.env
          printf 'MAILEZ_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> mailez.env
          printf 'MAILEZ_STACK_SECRET=%s\n' "$(openssl rand -hex 32)" >> mailez.env
          # mailez-mailezine:<tag> comes from the engine repo's release
          # workflow (lockstep tags); retry while it catches up.
          for i in $(seq 1 10); do
            docker compose --env-file mailez.env -f docker-compose.ce.yml pull && break
            echo "pull failed (attempt $i); engine image may not be published yet"
            sleep 30
          done
          # --env-file is required: compose ${VAR:?} interpolation reads
          # shell env and the --env-file only, never the services' env_file.
          docker compose --env-file mailez.env -f docker-compose.ce.yml up -d --wait

      - name: Health check
        run: |
          curl -sf http://localhost:8081/api/v1/health

      - name: Seed the admin account and smoke-login
        working-directory: deploy
        run: |
          docker compose --env-file mailez.env -f docker-compose.ce.yml exec -T backend mailez-seed
          curl -sf -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","pw":"MailezDemo2026!"}' \
            http://localhost:8081/api/v1/sso/login

  release:
    runs-on: ubuntu-latest
    needs: [build-images, smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Build the release tarball
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/make-release.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mailez-*.tar.gz
            dist/checksums.txt
