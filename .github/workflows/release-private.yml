name: release-private

# PRIVATE TREE ONLY. This file lives in the internal repository and is never
# exported to the public source tree. On v* tags it:
#   1. builds and pushes all mailez images via docker buildx bake
#      (group "default" -> public ghcr.io/mailez-hq/mailez-*,
#       group "ee" -> private ghcr.io/mailez-hq/mailez-*-ee),
#   2. boots the community stack FROM THE PUBLISHED IMAGES and smoke-tests
#      health + seed + SSO login,
#   3. packs the install tarball (scripts/make-release.sh) and attaches it
#      to the GitHub release.
#
# The mailezine engine images are NOT built here (no sibling checkout in
# this repo): mailez-hq/mailezine's own release workflow publishes
# ghcr.io/mailez-hq/mailez-mailezine[-ee]:<tag> in lockstep. Tag mailezine
# first, then this repo; the smoke job retries the pull accordingly.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The engine images come from mailezine's own release workflow. Building
      # and pushing the mailez images before that tag exists leaves the release
      # half-published (images up, smoke waiting, no release assets), so wait
      # for the engine tag here instead. See docs/release-process.md.
      - name: Require the engine images for this tag
        run: |
          for i in $(seq 1 20); do
            missing=""
            for image in mailez-mailezine mailez-mailezine-ee; do
              docker manifest inspect "ghcr.io/mailez-hq/$image:${GITHUB_REF_NAME}" >/dev/null 2>&1 || missing="$missing $image"
            done
            if [ -z "$missing" ]; then
              echo "engine images for ${GITHUB_REF_NAME} are published"
              exit 0
            fi
            echo "attempt $i/20: waiting for$missing:${GITHUB_REF_NAME}"
            sleep 30
          done
          echo "::error::engine images for ${GITHUB_REF_NAME} are not published (missing:$missing) — tag the mailezine repo with the same tag first; see docs/release-process.md"
          exit 1

  build-images:
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        group: [default, ee]
    steps:
      - uses: actions/checkout@v4
      # The EE backend verifies licenses against the vendor key baked in at
      # build time; without the secrets the image would ship with the dev
      # key and refuse MAILEZ_LICENSE_REQUIRED=true at startup. Fail here,
      # at release time, instead of at the customer.
      - name: Require the vendor license keys for EE builds
        if: matrix.group == 'ee'
        env:
          MAILEZ_LICENSE_PUBKEY: ${{ secrets.MAILEZ_LICENSE_PUBKEY }}
          MAILEZ_SERVICE_PUBKEY: ${{ secrets.MAILEZ_SERVICE_PUBKEY }}
        run: |
          if [ -z "$MAILEZ_LICENSE_PUBKEY" ] || [ -z "$MAILEZ_SERVICE_PUBKEY" ]; then
            echo "::error::EE releases require the MAILEZ_LICENSE_PUBKEY and MAILEZ_SERVICE_PUBKEY repo secrets (go run ./cmd/license genkey once, keep the private half in the secret store; see internal docs)"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker-bake.hcl + docker-bake.ee.hcl variables (VERSION/PLATFORMS/
      # APK_MIRROR/MAILEZ_LICENSE_PUBKEY/MAILEZ_SERVICE_PUBKEY) are
      # overridden by same-name environment variables. GH runners live
      # outside CN, so use the upstream Alpine CDN instead of the HCL's
      # aliyun default. The default-group job ignores the EE file's targets.
      - uses: docker/bake-action@v6
        env:
          VERSION: ${{ github.ref_name }}
          PLATFORMS: linux/amd64,linux/arm64
          APK_MIRROR: dl-cdn.alpinelinux.org
          MAILEZ_LICENSE_PUBKEY: ${{ secrets.MAILEZ_LICENSE_PUBKEY }}
          MAILEZ_SERVICE_PUBKEY: ${{ secrets.MAILEZ_SERVICE_PUBKEY }}
        with:
          files: |
            docker-bake.hcl
            docker-bake.ee.hcl
          targets: ${{ matrix.group }}
          push: true
          set: |
            *.cache-from=type=gha,scope=release-${{ matrix.group }}
            *.cache-to=type=gha,scope=release-${{ matrix.group }},mode=max

  # The community images are only useful if an anonymous client can pull them
  # (a package published from a private repo defaults to private, and a private
  # package answers `denied` for everyone outside the org). Fail the release
  # here rather than at the first user who tries `docker compose pull`.
  public-check:
    runs-on: ubuntu-latest
    needs: build-images
    env:
      REGISTRY: ghcr.io/mailez-hq
      CE_IMAGES: mailez-backend mailez-admin mailez-webmail mailez-nginx mailez-mailezine mailez-rspamd mailez-unbound mailez-macro-scanner mailez-engine-lb
      EE_IMAGES: mailez-backend-ee mailez-admin-ee mailez-webmail-ee mailez-mailezine-ee
    steps:
      - name: Community images must be anonymously pullable
        run: |
          fail=0
          for repo in ${CE_IMAGES}; do
            token=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:${REGISTRY}/${repo}:pull" \
              | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
            if [ -z "${token}" ]; then
              echo "::error::${REGISTRY}/${repo} is not public: an anonymous pull token was denied. Set the package visibility to Public (Org → Packages → ${repo} → Package settings → Change visibility)."
              fail=1
              continue
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://${REGISTRY}/v2/${repo}/manifests/${GITHUB_REF_NAME}")
            if [ "${code}" != "200" ]; then
              echo "::error::${REGISTRY}/${repo}:${GITHUB_REF_NAME} is not anonymously fetchable (HTTP ${code}) — was the tag published, and is the package public?"
              fail=1
            fi
          done
          exit ${fail}

      - name: Enterprise images must stay private
        run: |
          for repo in ${EE_IMAGES}; do
            token=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:${REGISTRY}/${repo}:pull" \
              | sed -n 's/.*"token":"\([^"]*\)".*/\1/p' || true)
            if [ -n "${token}" ]; then
              echo "::warning::${REGISTRY}/${repo} answers an anonymous pull token — enterprise images must not be public."
            fi
          done

  # `latest` is what a fresh community checkout pulls (mailezctl up ce with no
  # MAILEZ_IMAGE_TAG), so a stable release has to move it. Pre-release tags
  # (v1.0.1-rc.1) leave it where it is.
  publish-latest:
    runs-on: ubuntu-latest
    needs: build-images
    if: ${{ !contains(github.ref_name, '-') }}
    env:
      REGISTRY: ghcr.io/mailez-hq
      CE_IMAGES: mailez-backend mailez-admin mailez-webmail mailez-nginx mailez-mailezine mailez-rspamd mailez-unbound mailez-macro-scanner mailez-engine-lb
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Align the latest tag with this release
        run: |
          for repo in ${CE_IMAGES}; do
            docker buildx imagetools create \
              -t "${REGISTRY}/${repo}:latest" \
              "${REGISTRY}/${repo}:${GITHUB_REF_NAME}"
          done

  smoke:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Boot the community stack from published images
        working-directory: deploy
        env:
          # Shell env beats --env-file, so this pins the freshly pushed tag.
          MAILEZ_IMAGE_TAG: ${{ github.ref_name }}
        run: |
          cp mailez.env.example mailez.env
          printf 'MAILEZ_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> mailez.env
          printf 'MAILEZ_STACK_SECRET=%s\n' "$(openssl rand -hex 32)" >> mailez.env
          # mailez-mailezine:<tag> comes from the engine repo's release
          # workflow (lockstep tags); retry while it catches up.
          for i in $(seq 1 10); do
            docker compose --env-file mailez.env -f docker-compose.ce.yml pull && break
            echo "pull failed (attempt $i); engine image may not be published yet"
            sleep 30
          done
          # --env-file is required: compose ${VAR:?} interpolation reads
          # shell env and the --env-file only, never the services' env_file.
          docker compose --env-file mailez.env -f docker-compose.ce.yml up -d --wait

      - name: Health check
        run: |
          curl -sf http://localhost:8081/api/v1/health

      - name: Seed the admin account and smoke-login
        working-directory: deploy
        run: |
          docker compose --env-file mailez.env -f docker-compose.ce.yml exec -T backend mailez-seed
          curl -sf -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","pw":"MailezDemo2026!"}' \
            http://localhost:8081/api/v1/sso/login

  smoke-ee:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Boot the enterprise stack from the freshly published -ee images in
      # dev-license mode. The release images embed the vendor public key, so
      # CI cannot sign a real license; MAILEZINE_LICENSE_REQUIRED=false makes
      # the backend fall back to the built-in dev edition (production runs
      # the identical code path plus the license check). This is the only
      # place an -ee image set gets booted before a tag ships.
      - name: Boot the EE stack from published images (dev license mode)
        working-directory: deploy
        env:
          MAILEZ_IMAGE_TAG: ${{ github.ref_name }}
          MAILEZINE_LICENSE_REQUIRED: "false"
        run: |
          cp mailez.env.example mailez.env
          printf 'MAILEZ_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> mailez.env
          printf 'MAILEZ_STACK_SECRET=%s\n' "$(openssl rand -hex 32)" >> mailez.env
          # The compose file bind-mounts ./licenses (relative to deploy/ee);
          # an empty dir satisfies the mount and no license file is needed in
          # dev mode.
          mkdir -p ee/licenses
          # mailez-mailezine-ee:<tag> comes from the engine repo's release
          # workflow (lockstep tags); retry while it catches up.
          for i in $(seq 1 10); do
            docker compose --env-file mailez.env -f ee/docker-compose.ee.yml pull && break
            echo "pull failed (attempt $i); engine -ee image may not be published yet"
            sleep 30
          done
          docker compose --env-file mailez.env -f ee/docker-compose.ee.yml up -d --wait

      - name: Health check
        run: |
          curl -sf http://localhost:8081/api/v1/health
          curl -sf -o /dev/null http://localhost:8082
          curl -sf -o /dev/null http://localhost:8083

      - name: Seed the admin account and smoke-login
        working-directory: deploy
        run: |
          docker compose --env-file mailez.env -f ee/docker-compose.ee.yml exec -T backend mailez-seed
          curl -sf -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","pw":"MailezDemo2026!"}' \
            http://localhost:8081/api/v1/sso/login

  release:
    runs-on: ubuntu-latest
    needs: [build-images, smoke, smoke-ee, public-check, publish-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build the release tarball
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/make-release.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mailez-*.tar.gz
            dist/checksums.txt
