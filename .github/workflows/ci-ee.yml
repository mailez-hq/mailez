name: CI (tagged tree)

# Private CI only. This workflow is stripped from the public source
# export; the tagged build only works in the private tree (the public one
# has no backend/internal/ee and no mailez_ee-tagged files).

on:
  push:
    # dev is where the work lands and what gets exported.
    branches: [main, master, dev]
  pull_request:

permissions:
  contents: read

jobs:
  verify-tagged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The public CI gates gofmt; catch drift here instead of at the export.
      - name: Format check
        run: |
          unformatted=$(gofmt -l backend)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi
      # Purity gate: the untagged dependency graph must never reach
      # backend/internal/ee and every tagged file must match the export
      # strip contract.
      - run: make -f ee.mk purity
      - run: make -f ee.mk vet-ee
      - run: make -f ee.mk test-ee
      - run: make -f ee.mk build-ee
      # Dry-run the public export and enforce its post-conditions without
      # pushing.
      - run: make -f ee.mk export-ce-check

  # The frontends are always typechecked and built against the default
  # module set in ci.yml; the enterprise module set (frontend/apps/*/ee) is
  # only materialized when MAILEZ_MODULES=ee, so it needs its own gate.
  frontend-ee:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [webmail, admin]
    defaults:
      run:
        working-directory: frontend/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck (MAILEZ_MODULES=ee)
        run: npm run typecheck
        env:
          MAILEZ_MODULES: ee
      - name: Build (MAILEZ_MODULES=ee)
        run: npm run build
        env:
          MAILEZ_MODULES: ee
