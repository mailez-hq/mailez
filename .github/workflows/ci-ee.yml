name: CI (EE)

# Enterprise edition battery — private CI only. This workflow is stripped
# from the community mirror (the CE tree has no backend/internal/ee and no
# mailez_ee-tagged files, so the tagged build only works in the EE repo).

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-ee:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build (EE)
        run: go build -tags mailez_ee ./...
      - name: Vet (EE)
        run: go vet -tags mailez_ee ./...
      - name: Test (EE)
        run: go test -tags mailez_ee ./... -count=1
