name: release

# Tag-driven release. On v* tags this workflow:
#   1. builds and pushes the mailez images via docker buildx bake
#      (group "default" -> public ghcr.io/mailez-hq/mailez-*),
#   2. boots the stack FROM THE PUBLISHED IMAGES and smoke-tests
#      health + seed + SSO login,
#   3. packs the install tarball (scripts/make-release.sh) and attaches it
#      to the GitHub release.
#
# The mailezine engine images are NOT built here (no sibling checkout in
# this repo): mailez-hq/mailezine's own release workflow publishes
# ghcr.io/mailez-hq/mailez-mailezine:<tag> in lockstep. Tag mailezine
# first, then this repo; the smoke job retries the pull accordingly.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The engine image comes from mailezine's own release workflow. Building
      # and pushing the mailez images before that tag exists leaves the release
      # half-published (images up, smoke waiting, no release assets), so wait
      # for the engine tag here instead. See docs/release-process.md.
      - name: Require the engine image for this tag
        run: |
          for i in $(seq 1 20); do
            if docker manifest inspect "ghcr.io/mailez-hq/mailez-mailezine:${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              echo "engine image for ${GITHUB_REF_NAME} is published"
              exit 0
            fi
            echo "attempt $i/20: waiting for mailez-mailezine:${GITHUB_REF_NAME}"
            sleep 30
          done
          echo "::error::ghcr.io/mailez-hq/mailez-mailezine:${GITHUB_REF_NAME} is not published — tag the mailezine repo with the same tag first; see docs/release-process.md"
          exit 1

  build-images:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker-bake.hcl variables (VERSION/PLATFORMS/APK_MIRROR) are
      # overridden by same-name environment variables. GH runners live
      # outside CN, so use the upstream Alpine CDN instead of the HCL's
      # aliyun default.
      - uses: docker/bake-action@v6
        env:
          VERSION: ${{ github.ref_name }}
          PLATFORMS: linux/amd64,linux/arm64
          APK_MIRROR: dl-cdn.alpinelinux.org
        with:
          files: docker-bake.hcl
          targets: default
          push: true
          set: |
            *.cache-from=type=gha,scope=release-default
            *.cache-to=type=gha,scope=release-default,mode=max

  smoke:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Boot the stack from published images
        working-directory: deploy
        env:
          # Shell env beats --env-file, so this pins the freshly pushed tag.
          MAILEZ_IMAGE_TAG: ${{ github.ref_name }}
        run: |
          cp mailez.env.example mailez.env
          printf 'MAILEZ_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> mailez.env
          printf 'MAILEZ_STACK_SECRET=%s\n' "$(openssl rand -hex 32)" >> mailez.env
          # mailez-mailezine:<tag> comes from the engine repo's release
          # workflow (lockstep tags); retry while it catches up.
          for i in $(seq 1 10); do
            docker compose --env-file mailez.env -f docker-compose.ce.yml pull && break
            echo "pull failed (attempt $i); engine image may not be published yet"
            sleep 30
          done
          # --env-file is required: compose ${VAR:?} interpolation reads
          # shell env and the --env-file only, never the services' env_file.
          docker compose --env-file mailez.env -f docker-compose.ce.yml up -d --wait

      - name: Health check
        run: |
          curl -sf http://localhost:8081/api/v1/health

      - name: Seed the admin account and smoke-login
        working-directory: deploy
        run: |
          docker compose --env-file mailez.env -f docker-compose.ce.yml exec -T backend mailez-seed
          curl -sf -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","pw":"MailezDemo2026!"}' \
            http://localhost:8081/api/v1/sso/login

  release:
    runs-on: ubuntu-latest
    needs: [build-images, smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Build the release tarball
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/make-release.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mailez-*.tar.gz
            dist/checksums.txt
