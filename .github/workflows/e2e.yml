name: e2e

# Full-stack webmail e2e: builds the mailez images, boots the compose stack,
# seeds the admin account and drives the real webmail UI with Playwright.
# Heavy (image build + stack boot), so it runs on demand and on main pushes.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  webmail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build mailez images
        working-directory: backend
        run: go run ./cmd/build-images

      - name: Start the stack
        working-directory: deploy
        run: |
          cp mailez.env.example mailez.env
          printf 'MAILEZ_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> mailez.env
          printf 'MAILEZ_STACK_SECRET=%s\n' "$(openssl rand -hex 32)" >> mailez.env
          # --env-file is required: compose ${VAR:?} interpolation reads
          # shell env and the --env-file only, never the services' env_file.
          docker compose --env-file mailez.env -f docker-compose.community.yml up -d --build

      - name: Wait for the backend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/api/v1/health >/dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 5
          done
          echo "backend did not come up"
          docker ps -a
          exit 1

      # The community stack defaults to SQLite; seed inside the container
      # (the image ships mailez-seed) instead of host Go against MySQL.
      - name: Seed the admin account
        working-directory: deploy
        run: |
          docker compose --env-file mailez.env -f docker-compose.community.yml exec -T backend mailez-seed

      # The suite drives a dedicated throwaway account, not the seeded admin.
      - name: Create the e2e user
        run: |
          curl -sf -c /tmp/e2e-admin-cookies.txt -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","pw":"MailezDemo2026!"}' \
            http://localhost:8081/api/v1/sso/login
          curl -sf -b /tmp/e2e-admin-cookies.txt -H 'Content-Type: application/json' \
            -d '{"email":"e2esmoke@example.com","password":"E2eSmoke2026!","displayed_name":"E2E Smoke","enabled":true}' \
            http://localhost:8081/api/v1/users

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend/apps/webmail
        run: npx playwright install --with-deps chromium

      - name: Wait for webmail to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8083/ >/dev/null; then
              echo "webmail ready"
              exit 0
            fi
            sleep 5
          done
          echo "webmail did not come up"
          docker ps -a
          exit 1

      - name: Run e2e
        working-directory: frontend/apps/webmail
        env:
          MAILWEB_E2E_BASE_URL: http://localhost:8083
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/apps/webmail/playwright-report/
          retention-days: 7
