# mailez 引擎多活档（叠加在 docker-compose.ee.yml 之上）。
#
# 目标形态：引擎(mailezine) N 副本对同一份共享存储（TiDB KV + RustFS/S3
# blob）全服务多活——SMTP 收发、IMAP/POP3、ManageSieve 在任意副本上服务
# 任意账户；没有 leader/standby（与 docker-compose.ha.yml 互斥）。
#
# 多活依赖本仓库引擎侧的三个机制（mailezine >= 本版本）：
#   1. 出站队列按消息认领（MAILEZINE_CLUSTER_MODE=multi）：每条投递在
#      KV 事务里原子认领（owner + 租期），崩溃后租约到期被其他副本接管
#      （接管计一次尝试，crash-loop 不会无限重投）；认领丢失者写回会被
#      fencing 丢弃；
#   2. 单例后台 worker 跨节点租约（snooze sweeper 等）：任意时刻全集群
#      只有一个副本执行，副本失联后租约过期自动接管（at-least-once）；
#   3. 邮箱写路径走 TiDB 事务冲突检测 + 重放（mailezine 既有能力），
#      UID/modseq 分配多进程安全。
#
# 用法：
#   cd deploy
#   docker compose --env-file mailez.env \
#     -f ee/docker-compose.ee.yml -f ee/docker-compose.multi.yml up -d
#   # 或经统一入口（等价）：
#   ./mailezctl.sh up multi
#   # 本地源码构建：叠加 docker-compose.build.multi.yml 后 up -d --build
#   MAILEZ_LOCAL_BUILD=1 ./mailezctl.sh up multi
#   # 副本数（默认 2，上限 16 = engine-lb 的 haproxy 槽位）：
#   MAILEZ_ENGINE_REPLICAS=3 ./mailezctl.sh up multi
#
# 前置要求：Docker Compose ≥ 2.24（!override 与 deploy.replicas 直接生效）。
#
# 端口与流量：
# - mailezine 副本不再绑宿主端口；邮件端口（25/587/1587/465/143/993/
#   110/995/4190）由 engine-lb 统一发布，Docker DNS 展开全部副本、逐副本
#   健康检查、约 10s 感知副本上下线。
# - 真实客户端 IP：engine-lb 对全部后端连接注入 PROXY v1 头，引擎只信任
#   engine-lb 的固定 IP（192.168.206.250，见 networks）——DNSBL/策略评分
#   拿到真实来源。因此引擎的邮件端口只接受来自 LB 的连接：backend 的
#   引擎地址（IMAP/SMTP/Sieve）也改指向 engine-lb（经 LB 即带头）；管理
#   API(8090) 不经 LB，仍直连副本。
# - TLS 由引擎终止（PROXY 头在 TLS 之前，STARTTLS/隐式 TLS 均不受影响）。
# - 生产跨机部署：用云 L4 LB / keepalived VIP 替换 engine-lb 时保持同款
#   PROXY 语义（云 LB 开 PROXY protocol、MAILEZINE_PROXY_TRUSTED 收窄到
#   LB 地址）；MX 记录指向 LB。
#
# 已知取舍（详见 docs/scaling.md §多活）：
# - 投递语义 at-least-once：租约过期瞬间的接管可能造成个别重复投递
#   （与单机崩溃恢复语义一致）；
# - FTS 为最终一致：邮件落进集群后至多一个同步周期（默认 2s）内可在
#   任意节点搜到；副本重建/换机后自动全量重放重建索引；
# - NODE_ID 必须留空：compose 副本共享同一份 environment，引擎按容器
#   hostname 自动生成唯一 ID；若手工配同值会破坏认领 fencing。

services:

  mailezine:
    deploy:
      replicas: ${MAILEZ_ENGINE_REPLICAS:-2}
    # 多副本不能绑固定宿主端口（第二副本 bind 冲突）：邮件端口统一由
    # engine-lb 发布。!override 覆盖 enterprise 档的端口列表。
    ports: !override []
    environment:
      - MAILEZINE_CLUSTER_MODE=multi
      # 副本共享 env：留空让引擎按容器 hostname 自动生成（见上）。
      - MAILEZINE_CLUSTER_NODE_ID=
      # 多活下 FTS 由 changelog 追踪器收敛到每个节点的本地索引（投放
      # 路径不内联索引，每副本恰好索引一次）：搜索与单机一致。
      - MAILEZINE_FTS_ENABLED=true
      # 全部邮件端口要求 PROXY v1 头，且只信任 engine-lb 的固定 IP
      # （MAILEZ_LB_IP，默认 192.168.206.250）：真实客户端 IP 由此保留
      # （DNSBL/策略评分不再看到 LB 地址）。改过 MAILEZ_SUBNET 的话需
      # 同步设置 MAILEZ_LB_IP 为新网段内的地址。
      - MAILEZINE_PROXY_PROTOCOL=all
      - MAILEZINE_PROXY_TRUSTED=${MAILEZ_LB_IP:-192.168.206.250}/32
      # 隐式 TLS 端口（465/993/995，经 LB 的 PROXY 头之后由引擎终止）：
      # 复用 ./certs 的证书材料（与 gateway 同源；缺文件则引擎不监听
      # 这三个端口，engine-lb 对应后端会 DOWN）。
      - MAILEZINE_TLS_CERT_FILE=/certs/cert.pem
      - MAILEZINE_TLS_KEY_FILE=/certs/key.pem
    # 状态全在 TiDB/S3 兼容对象存储；本地仅剩 bleve 索引（派生数据，可随时全量
    # 重建）。匿名卷按副本隔离——同一卷被两个副本共享会互写损坏：
    #   /data/rocks.fts       ← 本节点 FTS 索引（重启保留）
    #   /data/rocks.fts.sync.json ← 追踪水位（副本重建后从 0 重放全量）
    # 证书与授权仍按副本只读挂载；archive 合规 spool 在 KV/blob，无本地盘。
    volumes: !override
      - "/data"
      - "../certs:/certs:ro"
      - "../licenses:/licenses:ro"

  # backend 的引擎地址改走 engine-lb（IMAP/SMTP/Sieve/内部 MTA 直投）：
  # 引擎的邮件端口现在只接受带 PROXY 头的 LB 连接，直连会被拒。管理
  # API(8090) 不经 LB，保持直连副本（服务名轮询）。environment 列表按
  # 变量名合并，覆盖 enterprise 档的同名值。
  backend:
    environment:
      - MAIL_IMAP_ADDR=engine-lb:143
      - MAIL_SMTP_ADDR=engine-lb:1587
      - MAIL_SIEVE_ADDR=engine-lb:4190
      - MAIL_MTA_ADDR=engine-lb:25
      # 带 scheme：backend 直接拼接该值作为请求 URL。
      - MAIL_ENGINE_MGMT_ADDR=http://mailezine:8090

  # 邮件端口负载均衡：TCP 透传 + PROXY v1 注入 + DNS 副本展开 + 健康检查。
  engine-lb:
    image: ${MAILEZ_REGISTRY:-ghcr.io/mailez-hq}/mailez-engine-lb:${MAILEZ_IMAGE_TAG:-latest}
    pull_policy: missing
    restart: always
    depends_on:
      - mailezine
    # 固定 IP：引擎的 MAILEZINE_PROXY_TRUSTED 按此地址收窄受信集（副本
    # 共享 env 无法写服务名，且收窄到 /32 才能挡住网段内其他容器伪造头）。
    # 与 MAILEZ_SUBNET 联动：改网段时同步设置 MAILEZ_LB_IP。
    networks:
      default:
        ipv4_address: ${MAILEZ_LB_IP:-192.168.206.250}
    ports:
      - "127.0.0.1:25:25"
      - "127.0.0.1:465:465"
      - "127.0.0.1:587:587"
      - "127.0.0.1:1587:1587"
      - "127.0.0.1:110:110"
      - "127.0.0.1:995:995"
      - "127.0.0.1:143:143"
      - "127.0.0.1:993:993"
      - "127.0.0.1:4190:4190"
