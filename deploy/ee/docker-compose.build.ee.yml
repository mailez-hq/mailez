# Build overlay for the enterprise profile: adds build instructions so
#   MAILEZ_LOCAL_BUILD=1 ./mailezctl.sh up ee   # (or ha)
# (or: docker compose --env-file mailez.env -f ee/docker-compose.ee.yml
#      -f ee/docker-compose.build.ee.yml up -d --build)
# builds all images from source instead of pulling prebuilt ones. The EE
# builds use the ee Dockerfiles and the ee module set (see args); the -ee
# image names come from the base enterprise file. The multi-active tier
# additionally needs docker-compose.build.multi.yml (engine-lb).
# Never shipped in release tarballs — pull-only deployments don't need it.

services:

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.ee
      args:
        # Release builds inject the vendor production public key so the
        # binary can enforce MAILEZ_LICENSE_REQUIRED (a dev-key build
        # refuses to enforce — see internal/ee/license). release-ee.sh
        # always sets this; leaving it empty yields a dev-key build.
        MAILEZ_LICENSE_PUBKEY: ${MAILEZ_LICENSE_PUBKEY:-}
        # Same keypair signs the technical-service certificate
        # (internal/entitlements). Without it the console can never verify a
        # service.lic — the Service card stays "Not subscribed" even after
        # the certificate is installed.
        MAILEZ_SERVICE_PUBKEY: ${MAILEZ_SERVICE_PUBKEY:-}

  frontend-admin:
    build:
      context: ../../frontend
      dockerfile: apps/admin/Dockerfile
      args:
        MAILEZ_MODULES: ee

  frontend-webmail:
    build:
      context: ../../frontend
      dockerfile: apps/webmail/Dockerfile
      args:
        MAILEZ_MODULES: ee

  gateway:
    build:
      context: ../..
      dockerfile: deploy/images/gateway/Dockerfile

  mailezine:
    build:
      # Relative to deploy/ee/: the sibling mailezine checkout. Override
      # with MAILEZINE_CONTEXT where the layout differs (CI sets ../mailezine).
      context: ${MAILEZINE_CONTEXT:-../../../mailezine}
      dockerfile: Dockerfile.ee
      args:
        VERSION: ${MAILEZ_IMAGE_TAG:-local}
        MAILEZ_LICENSE_PUBKEY: ${MAILEZ_LICENSE_PUBKEY:-}

  mail-filter:
    build:
      context: ../..
      dockerfile: deploy/images/mail-filter/Dockerfile

  macro-scanner:
    build:
      context: ../..
      dockerfile: deploy/images/macro-scanner/Dockerfile

  resolver:
    build:
      context: ../..
      dockerfile: deploy/images/resolver/Dockerfile
