# mailez 社区版生产档（postfix + dovecot，自包含）。
#
# 社区版 = 经典 postfix + dovecot 引擎的全容器化生产形态（区别于企业版
# mailezine）：nginx 网关做邮件端口代理（25/465/587/110/995/143/993/4190），
# dovecot 用 maildir（./data/mail），控制面与企业版一致用 MySQL。
# 邮件存储为本地 maildir，不使用 TiDB/MinIO。
#
# 用法：
#   cd deploy
#   docker compose -f docker-compose.community.yml up -d --build
#   docker compose -f docker-compose.community.yml ps / logs / down

name: mailez

services:

  redis:
    image: redis:alpine
    pull_policy: missing
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - "./data/redis:/data"

  mysql:
    image: mysql:8.0
    pull_policy: missing
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=mailez-root
      - MYSQL_DATABASE=mailez
      - MYSQL_USER=mailez
      - MYSQL_PASSWORD=mailez
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umailez", "-pmailez"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    volumes:
      - "./data/mysql:/var/lib/mysql"
    ports:
      - "127.0.0.1:13306:3306"

  # nginx 网关：邮件端口代理 + HTTP/ACME（postdove 形态）。
  gateway:
    image: mailez/nginx:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:25:25"
      - "127.0.0.1:465:465"
      - "127.0.0.1:587:587"
      - "127.0.0.1:110:110"
      - "127.0.0.1:995:995"
      - "127.0.0.1:143:143"
      - "127.0.0.1:993:993"
      - "127.0.0.1:4190:4190"
    volumes:
      - "./certs:/certs"
      - "./overrides/nginx:/overrides"
    depends_on:
      - backend

  backend:
    build: ../backend
    restart: always
    env_file: mailez.env
    environment:
      - MAILEZ_PORT=8080
      - DB_DRIVER=mysql
      - DB_DSN=mailez:mailez@tcp(mysql:3306)/mailez?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_ADDR=redis:6379
      - MAILEZ_HOSTNAME=mail.example.com
      - MAILEZ_DOMAIN=example.com
      - MAILEZ_SUBNET=192.168.206.0/24
      - MAILEZ_RECIPIENT_DELIMITER=+
      - MAILEZ_MESSAGE_RATELIMIT=200
      - MAILEZ_DKIM_SELECTOR=dkim
      # postdove：后端经网关内部代理端口访问邮件服务。
      - MAIL_IMAP_ADDR=gateway:1143
      - MAIL_SMTP_ADDR=gateway:1587
      - MAIL_SIEVE_ADDR=gateway:11490
      - FETCH_INTERVAL=300
      - AI_PROVIDER=none
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - "./data:/data"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  frontend-admin:
    build: ../frontend/apps/admin
    restart: always
    environment:
      - API_TARGET=http://backend:8080
      - PORT=3000
    ports:
      - "127.0.0.1:8082:3000"
    depends_on:
      - backend

  frontend-webmail:
    build: ../frontend/apps/webmail
    restart: always
    environment:
      - API_TARGET=http://backend:8080
      - PORT=3000
    ports:
      - "127.0.0.1:8083:3000"
    depends_on:
      - backend

  dovecot:
    image: mailez/dovecot:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    volumes:
      - "./data/mail:/mail"
      - "./overrides:/overrides"
    depends_on:
      - gateway

  postfix:
    image: mailez/postfix:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    volumes:
      - "./overrides:/overrides"
    depends_on:
      - gateway

  macro-scanner:
    image: mailez/macro-scanner:local
    pull_policy: missing
    hostname: macro-scanner
    restart: always
    networks:
      - no-egress

  mail-filter:
    image: mailez/rspamd:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    networks:
      - default
      - no-egress
    volumes:
      - "./data/filter:/var/lib/rspamd"
      - "./data/dkim:/dkim"
      - "./overrides/rspamd:/etc/rspamd/override.d"
    depends_on:
      - gateway
      - backend

  resolver:
    image: mailez/unbound:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    networks:
      default:
        ipv4_address: 192.168.206.254

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.206.0/24
  no-egress:
    driver: bridge
    internal: true
