# mailezine 引擎多活：邮件端口 L4 负载均衡（haproxy TCP 透传）。
#
# 复制发现：server-template 展开 Docker DNS 对 mailezine 服务返回的全部
# A 记录（最多 16 个副本槽位），逐副本 TCP 健康检查，故障节点自动摘除；
# 副本上下线约 10s（hold valid）内生效。
#
# 端口语义与 docker-compose.enterprise.yml 中 mailezine 直发的端口矩阵一致：
# TLS（STARTTLS/隐式 TLS 465/993/995）由引擎终止，本层纯透传、不注入
# PROXY 头（引擎未开 MAILEZINE_PROXY_PROTOCOL 时按 socket 对端地址记录
# 客户端 IP；需要真实来源的生产部署请用云 L4 LB + PROXY protocol 替换本层）。
global
    log stdout format raw local0 notice
    maxconn 8192

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    # 邮件会话长连接（IMAP IDLE / 大附件 DATA）：
    timeout client 1h
    timeout server 1h

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
    hold nx 3s
    hold other 10s
    hold refused 3s
    hold timeout 3s

# ---- SMTP：MX 入站（25） ----
listen smtp_in
    bind :25
    server-template node 1-16 mailezine:25 resolvers docker check init-addr last,libc,none

# ---- Submission：587（映射引擎 1587）与 1587 直连 ----
listen submission
    bind :587,:1587
    server-template node 1-16 mailezine:1587 resolvers docker check init-addr last,libc,none

# ---- SMTPS：隐式 TLS 465（引擎终止 TLS） ----
listen smtps
    bind :465
    server-template node 1-16 mailezine:465 resolvers docker check init-addr last,libc,none

# ---- IMAP：143（STARTTLS）与 IMAPS 993 ----
listen imap
    bind :143
    server-template node 1-16 mailezine:143 resolvers docker check init-addr last,libc,none

listen imaps
    bind :993
    server-template node 1-16 mailezine:993 resolvers docker check init-addr last,libc,none

# ---- POP3：110 与 POP3S 995 ----
listen pop3
    bind :110
    server-template node 1-16 mailezine:110 resolvers docker check init-addr last,libc,none

listen pop3s
    bind :995
    server-template node 1-16 mailezine:995 resolvers docker check init-addr last,libc,none

# ---- ManageSieve：4190 ----
listen sieve
    bind :4190
    server-template node 1-16 mailezine:4190 resolvers docker check init-addr last,libc,none
