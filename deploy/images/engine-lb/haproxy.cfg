# mailezine 引擎多活：邮件端口 L4 负载均衡（haproxy TCP + PROXY v1）。
#
# 复制发现：server-template 展开 Docker DNS 对 mailezine 服务返回的全部
# A 记录（最多 16 个副本槽位），逐副本健康检查，故障节点自动摘除；
# 副本上下线约 10s（hold valid）内生效。
#
# 真实客户端 IP：所有后端连接注入 PROXY v1 头（send-proxy）。引擎侧配
# MAILEZINE_PROXY_PROTOCOL=all 且 MAILEZINE_PROXY_TRUSTED 只含本 LB 的固定
# IP（ee/docker-compose.multi.yml 已配）——引擎的 DNSBL/策略评分于是拿到真实
# 来源而非 LB 地址。TLS（STARTTLS/隐式 TLS 465/993/995）仍由引擎终止：
# PROXY 头在 TLS 之前（plaintext 先行）。
#
# 健康检查说明：纯握手 check 会被引擎当作"受信但无 PROXY 头"拒收，且
# 验证不了服务可用。因此每个检查都带 PROXY 头并读取服务横幅（tcp-check
# expect）——既通过引擎的 PROXY 校验，又确认协议层可应答；隐式 TLS 端口
# 先做 TLS 握手（check-ssl）再读横幅。注意：显式定义 tcp-check connect
# 规则后，连接参数以该行为准，send-proxy 必须写在 connect 步骤上（仅
# server 行的 check-send-proxy 不会生效）。
global
    log stdout format raw local0 notice
    maxconn 8192

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    # 邮件会话长连接（IMAP IDLE / 大附件 DATA）：
    timeout client 1h
    timeout server 1h

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
    hold nx 3s
    hold other 10s
    hold refused 3s
    hold timeout 3s

# ---- SMTP：MX 入站（25） ----
listen smtp_in
    bind :25
    option tcp-check
    tcp-check connect send-proxy
    tcp-check expect string 220
    server-template node 1-16 mailezine:25 resolvers docker check inter 2s fall 3 rise 2 init-addr last,libc,none send-proxy

# ---- Submission：587（映射引擎 1587）与 1587 直连 ----
listen submission
    bind :587,:1587
    option tcp-check
    tcp-check connect send-proxy
    tcp-check expect string 220
    server-template node 1-16 mailezine:1587 resolvers docker check inter 2s fall 3 rise 2 init-addr last,libc,none send-proxy

# ---- SMTPS：隐式 TLS 465（PROXY 头在 TLS 之前） ----
listen smtps
    bind :465
    option tcp-check
    tcp-check connect send-proxy ssl
    tcp-check expect string 220
    server-template node 1-16 mailezine:465 resolvers docker check check-ssl verify none inter 2s fall 3 rise 2 init-addr last,libc,none send-proxy

# ---- IMAP：143（STARTTLS）与 IMAPS 993 ----
listen imap
    bind :143
    option tcp-check
    tcp-check connect send-proxy
    tcp-check expect rstring ^\*
    server-template node 1-16 mailezine:143 resolvers docker check inter 2s fall 3 rise 2 init-addr last,libc,none send-proxy

listen imaps
    bind :993
    option tcp-check
    tcp-check connect send-proxy ssl
    tcp-check expect rstring ^\*
    server-template node 1-16 mailezine:993 resolvers docker check check-ssl verify none inter 2s fall 3 rise 2 init-addr last,libc,none send-proxy

# ---- POP3：110 与 POP3S 995 ----
listen pop3
    bind :110
    option tcp-check
    tcp-check connect send-proxy
    tcp-check expect string +OK
    server-template node 1-16 mailezine:110 resolvers docker check inter 2s fall 3 rise 2 init-addr last,libc,none send-proxy

listen pop3s
    bind :995
    option tcp-check
    tcp-check connect send-proxy ssl
    tcp-check expect string +OK
    server-template node 1-16 mailezine:995 resolvers docker check check-ssl verify none inter 2s fall 3 rise 2 init-addr last,libc,none send-proxy

# ---- ManageSieve：4190 ----
listen sieve
    bind :4190
    option tcp-check
    tcp-check connect send-proxy
    tcp-check expect string IMPLEMENTATION
    server-template node 1-16 mailezine:4190 resolvers docker check inter 2s fall 3 rise 2 init-addr last,libc,none send-proxy
