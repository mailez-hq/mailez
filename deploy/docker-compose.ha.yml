# mailez 控制面横向扩容档（叠加在 docker-compose.ee.yml 之上）。
#
# 前提：控制面 DB 已是 MySQL、KV 已是 TiDB、blob 已是 MinIO（enterprise 档
# 自带）；backend 无状态化依赖本仓库的三个机制——
#   1. 定时发送 outbox 原子认领（多副本不双发，崩溃自动回收）；
#   2. singleton worker 的 DB 租约选主（fetch/推送/提醒/清理/ retention/
#      DLP/LDAP，每副本都起进程，只有租约持有者干活，TTL 60s 自动 failover）；
#   3. 超大附件/云盘走共享对象存储（MAILEZ_DRIVE_BACKEND=minio，本档设置）。
#
# 用法：
#   cd deploy
#   docker compose --env-file mailez.env \
#     -f docker-compose.ee.yml -f docker-compose.ha.yml up -d --build
#
# 机制说明：
# - backend 副本负载均衡：gateway nginx 模板以变量+resolver(30s) 反代
#   backend:8080，Docker DNS 返回全部副本 IP，自动轮询、动态生效。
# - SSE（webmail 实时流 / AI 流式）：端点已返回 X-Accel-Buffering: no，
#   任意代理层均直通；SSE 连接不要求会话粘性。
# - frontend 副本无状态，Docker 发布端口层面即已轮询。
# - 引擎(mailezine)服务层仍为 active-passive 租约单写者：跨主机再加
#   standby 节点（同 MAILEZINE_STORAGE_DSN/S3 即可自动接管），compose 单机
#   档不展开；KV(TiDB)/blob(MinIO) 本身即横向组件。

services:

  backend:
    deploy:
      replicas: 2
    # 多副本不能绑固定宿主端口（第二副本 bind 冲突）：backend 只经
    # gateway 内网访问。!override 覆盖 enterprise 档的端口列表。
    ports: !override []
    environment:
      # 超大附件 + 云盘落 MinIO：上传与下载可落在不同副本。
      - MAILEZ_DRIVE_BACKEND=minio

  frontend-admin:
    deploy:
      replicas: 2
    ports: !override []

  frontend-webmail:
    deploy:
      replicas: 2
    ports: !override []
    # webmail 在 HA 下经 gateway 访问：operator 在 deploy/overrides/nginx/
    # 放一个 webmail.conf（见 docs/scaling.md 附录），单副本调试可
    # `docker compose up -d frontend-webmail` 后用 docker port 直连。
