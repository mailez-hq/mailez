# Routes the mailez admin UI through the mailez gateway nginx. The admin app is
# built with basePath=/admin, so requests under /admin are proxied unchanged
# (pages, assets and its own /admin/api/v1 proxy all live under the prefix).
# The variable + http-level resolver (nginx.conf.tmpl) re-resolve the service
# name per request, so `--scale frontend-admin=N` replicas load-balance
# automatically. frontend-admin is the compose service name (docker DNS).
location /admin {
    include /etc/nginx/proxy.conf;
    set $admin_upstream frontend-admin:3000;
    proxy_pass http://$admin_upstream;
}
