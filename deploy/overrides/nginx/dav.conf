# CardDAV/CalDAV: the backend serves both under /dav (Basic Auth), and the
# webmail settings page hands users ${origin}/dav/ — but the gateway
# template has no route for them, so DAV sync only ever worked against the
# direct backend port. Route them here so phones (DAVx5), Thunderbird and
# iOS sync on the webmail domain and the backend host port can stay
# loopback-only. Reuses the server-level $backend variable
# (resolver-based, replica-safe), and proxy.conf already sets Host and
# http/1.1; the Authorization header passes through by default.
location /dav {
    include /etc/nginx/proxy.conf;
    proxy_pass http://$backend;
}
location ^~ /.well-known/carddav {
    include /etc/nginx/proxy.conf;
    proxy_pass http://$backend;
}
location ^~ /.well-known/caldav {
    include /etc/nginx/proxy.conf;
    proxy_pass http://$backend;
}
