# Exchange ActiveSync (EAS): the EE backend implements
# /Microsoft-Server-ActiveSync (Sync, FolderSync, Ping, SendMail, SmartReply,
# Search, ItemOperations, … — EAS 12.1/14.0/14.1 over WBXML), but the gateway
# template has no route for it, so mobile clients could only reach the
# loopback backend port. Publish it on the mail hostname over 443 and keep
# the backend port loopback-only.
#
# Reuses the server-level $backend variable (resolver-based, replica-safe);
# proxy.conf already sets Host and http/1.1, and the Authorization header
# (HTTP Basic — mailbox password or an app token) passes through by default.
location /Microsoft-Server-ActiveSync {
    include /etc/nginx/proxy.conf;
    proxy_pass http://$backend;
}

# Autodiscover stays served by the backend's autoconfig handler, which answers
# with IMAP/SMTP settings (Outlook desktop picks those up by typing just the
# address). Phones that set up an Exchange account need the ActiveSync variant
# instead; to publish that one, comment the line above out and uncomment this
# block — the backend's ActiveSync module serves it:
#
# location ~* ^/autodiscover/autodiscover\.xml$ {
#     include /etc/nginx/proxy.conf;
#     proxy_pass http://$backend;
# }
