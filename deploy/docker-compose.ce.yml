# mailez 社区版生产档（自包含）。
#
# 社区版与企业版同用 mailezine 引擎，区别只在规模组件：社区版单节点
# （控制面 SQLite + 引擎 pebble KV + 本地 FS blob），企业版再加
# MySQL/TiDB/MinIO/HA（见 docker-compose.ee.yml）。引擎直发邮件端口
# （25/465/587/110/995/143/993/4190），gateway(nginx) 只做 HTTP/ACME。
#
# 用法（镜像预构建发布，默认拉取）：
#   cd deploy
#   cp mailez.env.example mailez.env   # 并设置 MAILEZ_SECRET_KEY / MAILEZ_STACK_SECRET
#   ./mailezctl.sh up ce        # = docker compose --env-file mailez.env -f docker-compose.ce.yml up -d
#   ./mailezctl.sh ps community / logs community backend / down community
#
# 本地源码构建（叠加 docker-compose.build.ce.yml 后 up -d --build）：
#   MAILEZ_LOCAL_BUILD=1 ./mailezctl.sh up ce
#
# 注意 --env-file mailez.env：compose 的 ${VAR:?} 插值只读 shell 环境与
# --env-file 指定的文件，不读服务的 env_file，缺了它 stack secret 会直接
# 报错退出（mailezctl 脚本已内置该参数）。
#
# 首次部署需初始化管理员：docker compose --env-file mailez.env -f
# docker-compose.ce.yml exec backend mailez-seed。
#
# 控制面数据库默认 SQLite（文件落在 ./data/mailez.db，随 ./data 一起备份）。
# 偏好 MySQL 时：docker compose --env-file mailez.env --profile mysql -f
# docker-compose.ce.yml up -d，并在 mailez.env 里设置
# MAILEZ_DB_DRIVER=mysql 与
# MAILEZ_DB_DSN=mailez:mailez@tcp(mysql:3306)/mailez?charset=utf8mb4&parseTime=True&loc=Local
# （backend 的 DB_DRIVER/DB_DSN 由这两个变量插值得出）。

name: mailez

services:

  redis:
    image: redis:alpine
    pull_policy: missing
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - "./data/redis:/data"

  # 可选控制面数据库：默认 SQLite 零外部依赖；`--profile mysql` 启用本服务
  # 并将 backend 的 DB_DRIVER/DB_DSN 覆盖指向它（见文件头说明）。
  mysql:
    image: mysql:8.0
    profiles: ["mysql"]
    pull_policy: missing
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=mailez-root
      - MYSQL_DATABASE=mailez
      - MYSQL_USER=mailez
      - MYSQL_PASSWORD=mailez
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umailez", "-pmailez"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    volumes:
      - "./data/mysql:/var/lib/mysql"
    ports:
      - "127.0.0.1:13306:3306"

  backend:
    image: ${MAILEZ_REGISTRY:-ghcr.io/mailez-hq}/mailez-backend:${MAILEZ_IMAGE_TAG:-latest}
    restart: always
    env_file: mailez.env
    environment:
      - MAILEZ_PORT=8080
      # 控制面默认 SQLite：单机社区版零外部数据库依赖，./data/mailez.db
      # 随数据目录整体备份；需要 MySQL 见文件头 --profile mysql 说明。
      - DB_DRIVER=${MAILEZ_DB_DRIVER:-sqlite}
      - DB_DSN=${MAILEZ_DB_DSN:-/data/mailez.db}
      - REDIS_ADDR=redis:6379
      # Domain values come from mailez.env via interpolation — pinning them
      # here would silently override the operator's env file.
      - MAILEZ_HOSTNAME=${MAILEZ_HOSTNAME:-mail.${MAILEZ_DOMAIN:-example.com}}
      - MAILEZ_DOMAIN=${MAILEZ_DOMAIN:-example.com}
      # Production tier: enables the weak-secret guard (refuses placeholder
      # SECRET_KEY / empty STACK_SECRET).
      - MAILEZ_ENV=production
      # 社区版标记：无 license 文件时按 community（而非 dev）报告与运行。
      - MAILEZ_EDITION=ce
      - MAILEZ_SUBNET=${MAILEZ_SUBNET:-192.168.206.0/24}
      - MAILEZ_RECIPIENT_DELIMITER=+
      - MAILEZ_MESSAGE_RATELIMIT=200
      - MAILEZ_DKIM_SELECTOR=dkim
      # 引擎直连（mailezine 模式）：backend 直接访问引擎端口契约。
      - MAIL_IMAP_ADDR=mailezine:143
      - MAIL_SMTP_ADDR=mailezine:1587
      - MAIL_SIEVE_ADDR=mailezine:4190
      - MAIL_MTA_ADDR=mailezine:25
      # 删除用户时级联清除引擎侧数据(管理 API,compose 网络内可达)。secret
      # 必须与 mailezine 服务的 MAILEZINE_MANAGEMENT_SECRET 同值。
      - MAIL_ENGINE_MGMT_ADDR=mailezine:8090
      - MAIL_ENGINE_MGMT_SECRET=${MAILEZ_STACK_SECRET:?set in mailez.env}
      - FETCH_INTERVAL=300
      - AI_PROVIDER=none
      # 社区版无授权要求；技术服务证书可选。
      - MAILEZ_LICENSE_REQUIRED=false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "${MAILEZ_API_PORT:-8081}:8080"
    volumes:
      - "./data:/data"
    depends_on:
      redis:
        condition: service_healthy

  frontend-admin:
    image: ${MAILEZ_REGISTRY:-ghcr.io/mailez-hq}/mailez-admin:${MAILEZ_IMAGE_TAG:-latest}
    restart: always
    environment:
      - API_TARGET=http://backend:8080
      - PORT=3000
    ports:
      - "${MAILEZ_ADMIN_PORT:-8082}:3000"
    depends_on:
      - backend

  frontend-webmail:
    image: ${MAILEZ_REGISTRY:-ghcr.io/mailez-hq}/mailez-webmail:${MAILEZ_IMAGE_TAG:-latest}
    restart: always
    environment:
      - API_TARGET=http://backend:8080
      - PORT=3000
    ports:
      - "${MAILEZ_WEBMAIL_PORT:-8083}:3000"
    depends_on:
      - backend

  # mailezine 模式 gateway：同一 nginx 镜像，MAILEZ_ENGINE=mailezine 时
  # 渲染 HTTP-only 配置（自动证书走内置 lego）；邮件端口由引擎直发。
  gateway:
    image: ${MAILEZ_REGISTRY:-ghcr.io/mailez-hq}/mailez-nginx:${MAILEZ_IMAGE_TAG:-latest}
    pull_policy: missing
    restart: always
    env_file: mailez.env
    environment:
      - MAILEZ_ENGINE=mailezine
    ports:
      - "${MAILEZ_HTTP_PORT:-80}:80"
      - "${MAILEZ_HTTPS_PORT:-443}:443"
    volumes:
      - "./certs:/certs"
      - "./overrides:/overrides"
    depends_on:
      - backend

  mailezine:
    image: ${MAILEZ_REGISTRY:-ghcr.io/mailez-hq}/mailez-mailezine:${MAILEZINE_IMAGE_TAG:-${MAILEZ_IMAGE_TAG:-latest}}
    pull_policy: missing
    restart: always
    # mailez.env 同时供给 backend 与引擎:MAILEZINE_STACK_SECRET 必须与
    # backend 侧的 MAILEZ_STACK_SECRET 保持同值——空值时 /stack 内部 API
    # 不鉴权(仅限本地开发),生产部署必须设置(见 mailez.env.example)。
    env_file: mailez.env
    environment:
      - MAILEZINE_BACKEND_ADDRESS=backend:8080
      - MAILEZ_BACKEND_ADDRESS=backend
      - MAILEZINE_DIRECTORY_MODE=mailez
      - MAILEZINE_AUTH_MODE=mailez
      # 社区版单节点存储：pebble KV + 本地 FS blob（默认，无需 TiDB/MinIO）。
      - MAILEZINE_STORAGE_BACKEND=pebble
      - MAILEZINE_ROCKS_PATH=/data/rocks
      # 反垃圾：未配 MAILEZINE_RSPAMD_URL 时走引擎内置基础档（MAILEZINE_JUNK_*
      # 可调）；配置后升级为 rspamd 扫描（社区版即含），企业版另启用学习。
      - MAILEZINE_DKIM_VAULT_URL=http://backend:8080/stack/rspamd/vault
      - MAILEZINE_TRUSTED_NETS=${MAILEZ_SUBNET:-192.168.206.0/24}
      # 引擎直发标准端口 + 隐式 TLS（465/993/995）。
      - MAILEZINE_SMTP_ADDR=:25
      - MAILEZINE_SUBMISSION_ADDR=:1587
      - MAILEZINE_IMAP_ADDR=:143
      - MAILEZINE_MANAGESIEVE_ADDR=:4190
      - MAILEZINE_POP3_ADDR=:110
      - MAILEZINE_SMTPS_ADDR=:465
      - MAILEZINE_IMAPS_ADDR=:993
      - MAILEZINE_POP3S_ADDR=:995
      # TLS 默认关闭（与 README 一致）。启用隐式 TLS（465/993/995）时设：
      #   MAILEZINE_TLS_CERT_FILE=/certs/letsencrypt/live/mailez/nginx-chain.pem
      #   MAILEZINE_TLS_KEY_FILE=/certs/letsencrypt/live/mailez/privkey.pem
      - MAILEZINE_TLS_CERT_FILE=
      - MAILEZINE_TLS_KEY_FILE=
      - MAILEZINE_OUTBOUND_ENABLED=true
      - MAILEZINE_OUTBOUND_PORT=25
      # 管理 API(8090,compose 网络内):backend 删除用户时经此级联清除
      # 引擎数据;secret 与 backend 的 MAIL_ENGINE_MGMT_SECRET 同值。
      - MAILEZINE_MANAGEMENT_ADDR=:8090
      - MAILEZINE_MANAGEMENT_SECRET=${MAILEZ_STACK_SECRET:?set in mailez.env}
      - MAILEZINE_FTS_ENABLED=true
      - MAILEZINE_LOG_LEVEL=info
    user: "82:101"
    volumes:
      - "./data/mailezine:/data"
      - "./certs:/certs:ro"
    ports:
      - "127.0.0.1:25:25"
      - "127.0.0.1:465:465"
      - "127.0.0.1:587:1587"
      - "127.0.0.1:1587:1587"
      - "127.0.0.1:110:110"
      - "127.0.0.1:995:995"
      - "127.0.0.1:143:143"
      - "127.0.0.1:993:993"
      - "127.0.0.1:4190:4190"
    depends_on:
      gateway:
        condition: service_started

  macro-scanner:
    image: ${MAILEZ_REGISTRY:-ghcr.io/mailez-hq}/mailez-macro-scanner:${MAILEZ_IMAGE_TAG:-latest}
    pull_policy: missing
    hostname: macro-scanner
    restart: always
    networks:
      - no-egress

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${MAILEZ_SUBNET:-192.168.206.0/24}
  no-egress:
    driver: bridge
    internal: true
