# Build overlay for the community profile: adds build instructions so
#   MAILEZ_LOCAL_BUILD=1 ./mailezctl.sh up ce
# (or: docker compose --env-file mailez.env -f docker-compose.ce.yml
#      -f docker-compose.build.ce.yml up -d --build)
# builds all images from source instead of pulling prebuilt ones.
# Never shipped in release tarballs — pull-only deployments don't need it.

services:

  backend:
    build:
      context: ../backend
      dockerfile: backend/Dockerfile

  frontend-admin:
    build:
      context: ../frontend
      dockerfile: apps/admin/Dockerfile
      args:
        MAILEZ_MODULES: default

  frontend-webmail:
    build:
      context: ../frontend
      dockerfile: apps/webmail/Dockerfile
      args:
        MAILEZ_MODULES: default

  gateway:
    build:
      context: ..
      dockerfile: deploy/images/gateway/Dockerfile

  mailezine:
    build:
      # Relative to deploy/: the sibling mailezine checkout. Override with
      # MAILEZINE_CONTEXT where the layout differs (CI sets ../mailezine).
      context: ${MAILEZINE_CONTEXT:-../../mailezine}
      dockerfile: Dockerfile
      args:
        VERSION: ${MAILEZ_IMAGE_TAG:-local}

  macro-scanner:
    build:
      context: ..
      dockerfile: deploy/images/macro-scanner/Dockerfile
