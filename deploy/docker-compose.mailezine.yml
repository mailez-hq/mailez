# mailezine 引擎 profile（替换 postfix + dovecot）。
#
# 用法：
#   docker compose -f docker-compose.dev.yml -f docker-compose.mailezine.yml \
#     --profile mailezine up -d --build
#
# 说明：
#   - 本文件把 postfix/dovecot 移入 "postdove" profile：默认（不带 profile）
#     仍与原来一致；带 --profile mailezine 时只启动 mailezine 引擎。
#     注意：仅使用本覆写文件而不带任何 --profile 时不会启动任何引擎
#     （postfix/dovecot 已归入 postdove profile），请始终显式带上
#     --profile mailezine。
#   - 宿主机 backend 需要以 POSTFIX_ADDRESS=mailezine DOVECOT_ADDRESS=mailezine
#     启动；backend 直连引擎（MAIL_IMAP_ADDR=mailezine:143、
#     MAIL_SMTP_ADDR=mailezine:1587、MAIL_SIEVE_ADDR=mailezine:4190）。
#   - mailezine 直接发布邮件端口（25/465/587/143/993/110/995/4190）并自持
#     隐式 TLS（465/993/995）；gateway 只剩 caddy（HTTP/ACME），mailezine
#     模式下完全没有 nginx。存储默认 Pebble + 本地 FS（纯 Go，开发档）；
#     生产叠加 docker-compose.blob-s3.yml 切换到 MinIO/S3 blob。
name: mailez

services:

  # gateway in mailezine mode: caddy only (HTTP/ACME). The engine publishes
  # the mail ports itself, so no mail ports are mapped here.
  gateway:
    image: mailez/caddy:local
    environment:
      - MAILEZ_ENGINE=mailezine
    # Replace the base file's mail-port mappings (postdove proxy ports):
    # the engine publishes those itself; caddy only needs 80/443.
    ports: !reset
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"

  # Backend routes directly to the engine (no gateway mail proxy): set
  # MAIL_IMAP_ADDR=mailezine:143, MAIL_SMTP_ADDR=mailezine:1587 and
  # MAIL_SIEVE_ADDR=mailezine:4190 on the backend service/deployment.

  mailezine:
    image: mailez/mailezine:local
    build:
      context: ../../mailezine
      dockerfile: Dockerfile
    profiles: ["mailezine"]
    pull_policy: missing
    restart: always
    env_file: mailez.env
    environment:
      - MAILEZINE_BACKEND_ADDRESS=host.docker.internal:8080
      - MAILEZ_BACKEND_ADDRESS=host.docker.internal
      - MAILEZINE_STORAGE_BACKEND=pebble
      - MAILEZINE_ROCKS_PATH=/data/rocks
      - MAILEZINE_DIRECTORY_MODE=mailez
      - MAILEZINE_AUTH_MODE=mailez
      - MAILEZINE_RSPAMD_URL=http://mail-filter:11333/checkv2
      - MAILEZINE_DKIM_VAULT_URL=http://host.docker.internal:8080/stack/rspamd/vault
      - MAILEZINE_TRUSTED_NETS=192.168.206.0/24
      # 后端端口契约（与 dovecot/postfix 时代一致，gateway 无需改端口映射）
      - MAILEZINE_SMTP_ADDR=:25
      - MAILEZINE_SUBMISSION_ADDR=:1587
      - MAILEZINE_IMAP_ADDR=:143
      - MAILEZINE_MANAGESIEVE_ADDR=:4190
      - MAILEZINE_POP3_ADDR=:110
      - MAILEZINE_SMTPS_ADDR=:465
      - MAILEZINE_IMAPS_ADDR=:993
      - MAILEZINE_POP3S_ADDR=:995
      - MAILEZINE_TLS_CERT_FILE=/certs/letsencrypt/live/mailez/nginx-chain.pem
      - MAILEZINE_TLS_KEY_FILE=/certs/letsencrypt/live/mailez/privkey.pem
      - MAILEZINE_OUTBOUND_ENABLED=true
      - MAILEZINE_OUTBOUND_PORT=25
      - MAILEZINE_LOG_LEVEL=info
      # 合规归档：引擎把收/发副本持久转储到 backend 的归档存储。
      - MAILEZINE_ARCHIVE_ENABLED=true
      # 外发内容过滤（敏感词/审批）：提交时向 backend 查询裁决。
      - MAILEZINE_DLP_ENABLED=true
      # 全文检索：内置附件文本抽取（PDF/Office/文本），无需 Tika。
      - MAILEZINE_FTS_ENABLED=true
    # The image runs as unprivileged mailezine (uid 82): the host data dir
    # must be writable by that id (e.g. chown -R 82:101 data/mailezine).
    user: "82:101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./data/mailezine:/data"
      - "./certs:/certs:ro"
    ports:
      - "127.0.0.1:25:25"
      - "127.0.0.1:465:465"
      # submission: engine listens on 1587 (the backend contract).
      - "127.0.0.1:1587:1587"
      - "127.0.0.1:110:110"
      - "127.0.0.1:995:995"
      - "127.0.0.1:143:143"
      - "127.0.0.1:993:993"
      - "127.0.0.1:4190:4190"
    networks:
      default:
        ipv4_address: 192.168.206.7
    depends_on:
      - gateway
      - mail-filter
      - resolver

  # rspamd renders its worker config from MAILEZ_ENGINE: mailezine wants an
  # HTTP checkv2 scanner, postdove keeps the milter proxy.
  mail-filter:
    environment:
      - MAILEZ_ENGINE=mailezine

  # Expose redis to the host-run backend (17379, avoiding local 6379/16379).
  redis:
    ports:
      - "127.0.0.1:17379:6379"

  # 默认引擎保持可用：只有显式 --profile postdove 时才启动它们。
  postfix:
    profiles: ["postdove"]

  dovecot:
    profiles: ["postdove"]
