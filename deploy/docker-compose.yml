# mailez compose
# Third-party components (nginx/postfix/dovecot/rspamd) are reused from the mail-stack reference
# images. The mailez backend replaces the the mail-stack reference admin container; the the mail-stack reference
# images reach its internal API at http://backend:8080 (the port is hardcoded
# to 8080 inside the the mail-stack reference images). Frontend services arrive with phase 2.

services:

  redis:
    image: redis:alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - "./data/redis:/data"

  front:
    image: mailez/nginx:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:25:25"
      - "127.0.0.1:465:465"
      - "127.0.0.1:587:587"
      - "127.0.0.1:110:110"
      - "127.0.0.1:995:995"
      - "127.0.0.1:143:143"
      - "127.0.0.1:993:993"
      - "127.0.0.1:4190:4190"
    volumes:
      - "./certs:/certs"
      - "./overrides/nginx:/overrides"
    depends_on:
      - backend

  backend:
    build: ../backend
    restart: always
    env_file: mailez.env
    environment:
      - MAILEZ_PORT=8080
      - DB_DSN=/data/mailez.db
      - REDIS_ADDR=redis:6379
      - HOSTNAME=mail.example.com
      - DOMAIN=example.com
      - SUBNET=192.168.206.0/24
      - RECIPIENT_DELIMITER=+
      - MESSAGE_RATELIMIT=200
      - DKIM_SELECTOR=dkim
      - MAIL_IMAP_ADDR=front:10143
      - MAIL_SMTP_ADDR=front:10025
      - MAIL_SIEVE_ADDR=front:4190
      - FETCH_INTERVAL=300
      - AI_PROVIDER=none
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - "./data:/data"
    depends_on:
      redis:
        condition: service_healthy

  admin:
    build: ../frontend/apps/admin
    restart: always
    environment:
      - API_TARGET=http://backend:8080
      - PORT=3000
    ports:
      - "127.0.0.1:8082:3000"
    depends_on:
      - backend

  webmail:
    build: ../frontend/apps/webmail
    restart: always
    environment:
      - API_TARGET=http://backend:8080
      - PORT=3000
    ports:
      - "127.0.0.1:8083:3000"
    depends_on:
      - backend

  imap:
    image: mailez/dovecot:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    volumes:
      - "./data/mail:/mail"
      - "./overrides:/overrides"
    depends_on:
      - front

  smtp:
    image: mailez/postfix:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    volumes:
      - "./overrides:/overrides"
    depends_on:
      - front

  oletools:
    image: mailez/oletools:local
    pull_policy: missing
    hostname: oletools
    restart: always
    networks:
      - noinet

  antispam:
    image: mailez/rspamd:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    networks:
      - default
      - noinet
    volumes:
      - "./data/filter:/var/lib/rspamd"
      - "./data/dkim:/dkim"
      - "./overrides/rspamd:/etc/rspamd/override.d"
    depends_on:
      - front
      - backend

  resolver:
    image: mailez/unbound:local
    pull_policy: missing
    env_file: mailez.env
    restart: always
    networks:
      default:
        ipv4_address: 192.168.206.254

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.206.0/24
  noinet:
    driver: bridge
    internal: true
