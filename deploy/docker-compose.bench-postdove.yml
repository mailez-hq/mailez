# Isolated postdove stack for the 10k-user benchmark (docs/benchmark.md).
#
# Differs from docker-compose.dev.yml:
#   - own bridge subnet (192.168.210.0/24) and project name so it never
#     collides with a dev stack;
#   - host ports on high ranges (25025/21587/21143/...) so a dev stack can
#     run at the same time;
#   - maildir and queue on Docker named volumes (Linux VM disk), NOT Windows
#     bind mounts — maildir is small-file IO and bind mounts distort it;
#   - backend runs on the host at :8080 (MAILEZ_BACKEND_ADDRESS) and must be
#     started with POSTFIX_ADDRESS=192.168.210.4 DOVECOT_ADDRESS=192.168.210.5.
name: bench-postdove

services:

  gateway:
    image: mailez/nginx:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    environment:
      - MAILEZ_BACKEND_ADDRESS=192.168.65.254
      - MAILEZ_TLS=off
      - MAILEZ_SUBNET=192.168.210.0/24
      - MAILEZ_RESOLVER_ADDRESS=223.5.5.5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:25025:25"
      - "127.0.0.1:22587:587"
      - "127.0.0.1:21587:1587"
      - "127.0.0.1:21143:1143"
      - "127.0.0.1:2110:110"
      - "127.0.0.1:24190:4190"
    networks:
      default:
        ipv4_address: 192.168.210.3

  dovecot:
    image: mailez/dovecot:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    environment:
      - MAILEZ_BACKEND_ADDRESS=host.docker.internal
      - MAILEZ_SUBNET=192.168.210.0/24
      - MAILEZ_GREYLISTING=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bench-mail:/mail
      - "./overrides:/overrides"
    networks:
      default:
        ipv4_address: 192.168.210.5
    depends_on:
      - gateway

  postfix:
    image: mailez/postfix:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    environment:
      - MAILEZ_BACKEND_ADDRESS=host.docker.internal
      - MAILEZ_SUBNET=192.168.210.0/24
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bench-postfix-queue:/queue
      - "./bench-postfix:/overrides"
    networks:
      default:
        ipv4_address: 192.168.210.4
    depends_on:
      - gateway

  mail-filter:
    image: mailez/rspamd:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    environment:
      - MAILEZ_BACKEND_ADDRESS=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bench-dkim:/dkim
      - "./bench-rspamd:/etc/rspamd/override.d"
    networks:
      default:
        ipv4_address: 192.168.210.6
    depends_on:
      - gateway

  redis:
    image: redis:alpine
    pull_policy: missing
    restart: always
    # Shared control-plane Redis: the host-run backend (REDIS_ADDR) and the
    # mailezine phase (same backend) reach it through this published port.
    ports:
      - "127.0.0.1:16379:6379"
    networks:
      default:
        ipv4_address: 192.168.210.100

  resolver:
    image: mailez/unbound:local
    pull_policy: missing
    env_file: mailez.env
    restart: always
    networks:
      default:
        ipv4_address: 192.168.210.254

volumes:
  bench-mail:
  bench-postfix-queue:
  bench-dkim:

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.210.0/24
