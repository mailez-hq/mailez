# mailez 生产档（自包含，唯一生产 compose 文件）。
#
# 存储：MySQL（控制面）+ TiDB（引擎 KV）+ MinIO/S3（正文 blob）。
# 全容器化：backend / frontend-admin / frontend-webmail / gateway(caddy) /
# mailezine 引擎 + redis/mysql/tidb/minio/rspamd/unbound/macro-scanner。
#
# 用法：
#   cd deploy
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml ps / logs / down
#
# 首次部署需初始化管理员：docker compose -f docker-compose.prod.yml exec
# backend go run ./cmd/seed（或把 DB_DSN 指向 MySQL 后本地执行）。

name: mailez

services:

  redis:
    image: redis:alpine
    pull_policy: missing
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - "./data/redis:/data"

  mysql:
    image: mysql:8.0
    pull_policy: missing
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=mailez-root
      - MYSQL_DATABASE=mailez
      - MYSQL_USER=mailez
      - MYSQL_PASSWORD=mailez
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umailez", "-pmailez"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    volumes:
      - "./data/mysql:/var/lib/mysql"
    ports:
      - "127.0.0.1:13306:3306"

  # 单节点 TiDB（unistore）：引擎 KV（账号/邮箱索引/UID/配额/队列 spool）。
  tidb:
    image: pingcap/tidb:v8.5.1
    pull_policy: missing
    restart: always
    command: ["--store=unistore", "--path=/tmp/tidb"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - "./data/tidb:/tmp/tidb"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4000 && exec 3>&-'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 8s

  # MinIO/S3 对象存储：正文/附件 blob。
  minio:
    image: minio/minio:latest
    pull_policy: missing
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=mailezine
      - MINIO_ROOT_PASSWORD=mailezine-e2e-pass
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - "./data/minio:/data"
    ports:
      - "127.0.0.1:29000:9000"
      - "127.0.0.1:29001:9001"

  backend:
    build: ../backend
    restart: always
    env_file: mailez.env
    environment:
      - MAILEZ_PORT=8080
      - DB_DRIVER=mysql
      - DB_DSN=mailez:mailez@tcp(mysql:3306)/mailez?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_ADDR=redis:6379
      - MAILEZ_HOSTNAME=mail.example.com
      - MAILEZ_DOMAIN=example.com
      - MAILEZ_SUBNET=192.168.206.0/24
      - MAILEZ_RECIPIENT_DELIMITER=+
      - MAILEZ_MESSAGE_RATELIMIT=200
      - MAILEZ_DKIM_SELECTOR=dkim
      # 引擎直连（mailezine 模式）：backend 直接访问引擎端口契约。
      - MAIL_IMAP_ADDR=mailezine:143
      - MAIL_SMTP_ADDR=mailezine:1587
      - MAIL_SIEVE_ADDR=mailezine:4190
      - FETCH_INTERVAL=300
      - AI_PROVIDER=none
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - "./data:/data"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  frontend-admin:
    build: ../frontend/apps/admin
    restart: always
    environment:
      - API_TARGET=http://backend:8080
      - PORT=3000
    ports:
      - "127.0.0.1:8082:3000"
    depends_on:
      - backend

  frontend-webmail:
    build: ../frontend/apps/webmail
    restart: always
    environment:
      - API_TARGET=http://backend:8080
      - PORT=3000
    ports:
      - "127.0.0.1:8083:3000"
    depends_on:
      - backend

  # mailezine 模式 gateway：仅 caddy（HTTP/ACME）；邮件端口由引擎直发。
  gateway:
    image: mailez/caddy:local
    pull_policy: missing
    restart: always
    environment:
      - MAILEZ_ENGINE=mailezine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - "./certs:/certs"
      - "./overrides:/overrides"
    depends_on:
      - backend

  mailezine:
    image: mailez/mailezine:local
    build:
      context: ../../mailezine
      dockerfile: Dockerfile
    pull_policy: missing
    restart: always
    environment:
      - MAILEZINE_BACKEND_ADDRESS=backend:8080
      - MAILEZ_BACKEND_ADDRESS=backend
      - MAILEZINE_DIRECTORY_MODE=mailez
      - MAILEZINE_AUTH_MODE=mailez
      # 生产存储：TiDB KV + MinIO/S3 blob。
      - MAILEZINE_STORAGE_BACKEND=tidb
      - MAILEZINE_STORAGE_DSN=root@tcp(tidb:4000)/test
      - MAILEZINE_ROCKS_PATH=/data/rocks
      - MAILEZINE_S3_ENDPOINT=minio:9000
      - MAILEZINE_S3_ACCESS_KEY=mailezine
      - MAILEZINE_S3_SECRET_KEY=mailezine-e2e-pass
      - MAILEZINE_S3_BUCKET=mailezine
      - MAILEZINE_S3_USE_SSL=false
      - MAILEZINE_RSPAMD_URL=http://mail-filter:11333/checkv2
      - MAILEZINE_DKIM_VAULT_URL=http://backend:8080/stack/rspamd/vault
      - MAILEZINE_TRUSTED_NETS=192.168.206.0/24
      # 引擎直发标准端口 + 隐式 TLS（465/993/995）。
      - MAILEZINE_SMTP_ADDR=:25
      - MAILEZINE_SUBMISSION_ADDR=:1587
      - MAILEZINE_IMAP_ADDR=:143
      - MAILEZINE_MANAGESIEVE_ADDR=:4190
      - MAILEZINE_POP3_ADDR=:110
      - MAILEZINE_SMTPS_ADDR=:465
      - MAILEZINE_IMAPS_ADDR=:993
      - MAILEZINE_POP3S_ADDR=:995
      - MAILEZINE_TLS_CERT_FILE=/certs/letsencrypt/live/mailez/nginx-chain.pem
      - MAILEZINE_TLS_KEY_FILE=/certs/letsencrypt/live/mailez/privkey.pem
      - MAILEZINE_OUTBOUND_ENABLED=true
      - MAILEZINE_OUTBOUND_PORT=25
      - MAILEZINE_ARCHIVE_ENABLED=true
      - MAILEZINE_DLP_ENABLED=true
      - MAILEZINE_FTS_ENABLED=true
      - MAILEZINE_LOG_LEVEL=info
    user: "82:101"
    volumes:
      - "./data/mailezine:/data"
      - "./certs:/certs:ro"
    ports:
      - "127.0.0.1:25:25"
      - "127.0.0.1:465:465"
      - "127.0.0.1:1587:1587"
      - "127.0.0.1:110:110"
      - "127.0.0.1:995:995"
      - "127.0.0.1:143:143"
      - "127.0.0.1:993:993"
      - "127.0.0.1:4190:4190"
    networks:
      default:
        ipv4_address: 192.168.206.7
    depends_on:
      - gateway
      - mail-filter
      - resolver
      - minio
      - tidb

  mail-filter:
    image: mailez/rspamd:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    environment:
      - MAILEZ_ENGINE=mailezine
    networks:
      default: {}
      no-egress: {}
    volumes:
      - "./data/filter:/var/lib/rspamd"
      - "./data/dkim:/dkim"
      - "./overrides/rspamd:/etc/rspamd/override.d"
    depends_on:
      - gateway
      - backend

  macro-scanner:
    image: mailez/macro-scanner:local
    pull_policy: missing
    hostname: macro-scanner
    restart: always
    networks:
      - no-egress

  resolver:
    image: mailez/unbound:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    networks:
      default:
        ipv4_address: 192.168.206.254

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.206.0/24
  no-egress:
    driver: bridge
    internal: true
