# mailez 开发档（自包含，唯一开发 compose 文件）。
#
# 存储：SQLite（宿主机 backend）+ Pebble KV + 本地 FS blob。
# 运行形态：backend / webmail / admin 在宿主机开发模式跑（go run /
# npm run dev），本文件只编排邮件栈依赖：redis、rspamd、unbound 和
# mailezine 引擎。引擎直发邮件端口（25/110/143/1587/4190），通过
# host.docker.internal:8080 访问宿主机 backend 的目录/认证接口。
#
# 用法（backend 需先按 docs/dev-setup.md 在宿主机 :8080 起来）：
#   cd deploy
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml down

name: mailez

services:

  redis:
    image: redis:alpine
    pull_policy: missing
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - "./data/redis:/data"

  mailezine:
    image: mailez/mailezine:local
    build:
      context: ../../mailezine
      dockerfile: Dockerfile
    pull_policy: missing
    restart: always
    environment:
      # 控制面在宿主机（开发模式），引擎经 host.docker.internal 取目录/认证。
      - MAILEZINE_BACKEND_ADDRESS=host.docker.internal:8080
      - MAILEZ_BACKEND_ADDRESS=host.docker.internal
      - MAILEZINE_DIRECTORY_MODE=mailez
      - MAILEZINE_AUTH_MODE=mailez
      # 开发档存储：Pebble KV + 本地 FS blob（不设 MAILEZINE_S3_*）。
      - MAILEZINE_STORAGE_BACKEND=pebble
      - MAILEZINE_ROCKS_PATH=/data/rocks
      - MAILEZINE_RSPAMD_URL=http://mail-filter:11333/checkv2
      - MAILEZINE_DKIM_VAULT_URL=http://host.docker.internal:8080/stack/rspamd/vault
      - MAILEZINE_TRUSTED_NETS=192.168.206.0/24
      # 明文端口（开发不配 TLS）；465/993/995 隐式 TLS 不启用。
      - MAILEZINE_SMTP_ADDR=:25
      - MAILEZINE_SUBMISSION_ADDR=:1587
      - MAILEZINE_IMAP_ADDR=:143
      - MAILEZINE_MANAGESIEVE_ADDR=:4190
      - MAILEZINE_POP3_ADDR=:110
      - MAILEZINE_OUTBOUND_ENABLED=true
      - MAILEZINE_OUTBOUND_PORT=25
      - MAILEZINE_ARCHIVE_ENABLED=true
      - MAILEZINE_DLP_ENABLED=true
      - MAILEZINE_FTS_ENABLED=true
      - MAILEZINE_LOG_LEVEL=info
    # 引擎以非特权用户运行（uid 82）：宿主机 ./data/mailezine 需 chown 82:101。
    user: "82:101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./data/mailezine:/data"
    ports:
      - "127.0.0.1:25:25"
      - "127.0.0.1:1587:1587"
      - "127.0.0.1:110:110"
      - "127.0.0.1:143:143"
      - "127.0.0.1:4190:4190"
    depends_on:
      - mail-filter
      - resolver

  mail-filter:
    image: mailez/rspamd:local
    pull_policy: missing
    restart: always
    env_file: mailez.env
    environment:
      - MAILEZ_BACKEND_ADDRESS=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default: {}
      no-egress: {}
    volumes:
      - "./data/filter:/var/lib/rspamd"
      - "./data/dkim:/dkim"
      - "./overrides/rspamd:/etc/rspamd/override.d"

  resolver:
    image: mailez/unbound:local
    pull_policy: missing
    restart: always
    env_file: mailez.env

networks:
  default:
    driver: bridge
  no-egress:
    driver: bridge
    internal: true
