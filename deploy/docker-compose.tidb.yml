# TiDB 存储 profile（叠加在 docker-compose.mailezine.yml 之上）。
#
# 把统一栈（mailez 控制面 + mailezine 引擎）的 KV 层从本地 Pebble 换成
# 分布式 TiDB：引擎的账号/邮箱索引、UID、配额、队列 spool 落在 TiDB，
# 正文 blob 仍走 MinIO/S3（与 pebble 模式一致的生产形态）。
#
# 用法（同一 compose 项目 mailez，全部一起管理）：
#   cd deploy
#   docker compose -f docker-compose.dev.yml \
#       -f docker-compose.mailezine.yml -f docker-compose.tidb.yml \
#       --profile mailezine up -d --build
#   docker compose -f docker-compose.dev.yml \
#       -f docker-compose.mailezine.yml -f docker-compose.tidb.yml \
#       --profile mailezine ps / logs / down
#
# 引擎切换后旧邮件数据（pebble）不会自动迁移；切换存储属于运维动作，
# 详见 deploy/scripts/README.md 的引擎矩阵。

name: mailez

services:

  # 单节点 TiDB（unistore）：MySQL 协议，供引擎 MAILEZINE_STORAGE_BACKEND=tidb
  # 使用。生产多节点形态由 TiDB 集群（PD/TiKV/CDC）替代，本服务保持不变。
  tidb:
    image: pingcap/tidb:v8.5.1
    pull_policy: missing
    restart: always
    command: ["--store=unistore", "--path=/tmp/tidb"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - "./data/tidb:/tmp/tidb"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4000 && exec 3>&-'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 8s

  # 引擎在 tidb profile 下只换 KV 后端：blob 仍用 minio（S3），其余
  # directory/auth/端口/TLS 配置全部继承 docker-compose.mailezine.yml。
  mailezine:
    environment:
      - MAILEZINE_STORAGE_BACKEND=tidb
      - MAILEZINE_STORAGE_DSN=root@tcp(tidb:4000)/test
    depends_on:
      tidb:
        condition: service_healthy
