<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="mailez EZ">
  <defs>
    <linearGradient id="mz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8E6C"/>
      <stop offset="1" stop-color="#2E6E8E"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile background -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#mz-bg)"/>

  <!--
    E and Z as separate letterforms with a clear gap between them.
    The top edges of both letters align; a short V fold line spans the
    gap to read as the envelope flap crease.
  -->
  <g fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <!-- E: spine + three arms -->
    <path d="M118 170 V350"/>
    <path d="M118 170 H232"/>
    <path d="M118 260 H214"/>
    <path d="M118 350 H232"/>
    <!-- Z: top arm, diagonal, bottom arm -->
    <path d="M394 170 H280"/>
    <path d="M394 170 L280 350"/>
    <path d="M280 350 H394"/>
  </g>

  <!-- Envelope flap crease spanning the gap at the top -->
  <path d="M232 170 L256 232 L280 170" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
</svg>
