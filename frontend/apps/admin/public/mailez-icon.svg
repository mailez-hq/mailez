<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="mailez EZ">
  <defs>
    <linearGradient id="mz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8E6C"/>
      <stop offset="1" stop-color="#2E6E8E"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile background -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#mz-bg)"/>

  <!--
    Connected EZ whose strokes double as an abstract envelope:
      E (left): spine + three arms -> envelope left edge, top, seam, bottom.
      Z (right): top arm continues the top, diagonal stays as the flap fold,
                 bottom arm continues the bottom, right arm closes the side.
    No enclosing frame - the letterforms themselves suggest the envelope.
  -->
  <g fill="none" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <!-- E spine (envelope left edge) -->
    <path d="M140 172 V340"/>
    <!-- E top arm (envelope top edge, left half) -->
    <path d="M140 172 H248"/>
    <!-- E middle arm (flap seam) -->
    <path d="M140 256 H232"/>
    <!-- E bottom arm (envelope bottom edge, left half) -->
    <path d="M140 340 H248"/>
    <!-- Z top arm (envelope top edge, right half) -->
    <path d="M372 172 H248"/>
    <!-- Z diagonal (flap fold, open) -->
    <path d="M372 172 L248 340"/>
    <!-- Z bottom arm (envelope bottom edge, right half) -->
    <path d="M248 340 H372"/>
    <!-- Z right arm (closes the right side) -->
    <path d="M372 172 V340"/>
  </g>

  <!-- A short flap crease from the top-center keeps the envelope read -->
  <path d="M248 172 L270 228" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.75"/>
</svg>
