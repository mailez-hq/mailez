<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="mailez">
  <defs>
    <linearGradient id="mz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8E6C"/>
      <stop offset="1" stop-color="#2E6E8E"/>
    </linearGradient>
    <linearGradient id="mz-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F5EE"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile, no perforated edge. -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#mz-bg)"/>
  <!-- Subtle inner highlight for depth on light backgrounds. -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="10"/>
  <!-- Envelope: flap + body, drawn as clean strokes. -->
  <g fill="none" stroke="url(#mz-m)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <!-- envelope flap (V) -->
    <path d="M142 196 L256 288 L370 196"/>
    <!-- envelope body -->
    <path d="M142 196 H370 V326 H142 Z"/>
  </g>
  <!-- Swoosh: paper plane leaving the envelope (speed + mail). -->
  <path d="M406 130 L472 96 L446 164 Z" fill="#FFD98A"/>
  <path d="M472 96 L446 164 L420 150 Z" fill="#FFC96B"/>
</svg>
