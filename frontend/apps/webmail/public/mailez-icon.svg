<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="mailez EZ">
  <defs>
    <linearGradient id="mz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8E6C"/>
      <stop offset="1" stop-color="#2E6E8E"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile background (solid gradient, no stroke tricks). -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#mz-bg)"/>
  <!-- Subtle top highlight -->
  <rect x="24" y="24" width="464" height="232" rx="100" fill="#FFFFFF" opacity="0.08"/>
  <rect x="24" y="232" width="464" height="256" fill="#FFFFFF" opacity="0.08"/>
  <!-- "EZ" wordmark: direct bold letters, unmistakable at any size. -->
  <text x="256" y="330" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="240" font-weight="800" fill="#FFFFFF" letter-spacing="-8">EZ</text>
  <!-- Envelope notch on the bottom-right corner to keep the mail identity. -->
  <g stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M340 400 H440 V452 H340 Z" />
    <path d="M340 400 L390 432 L440 400" />
  </g>
</svg>
