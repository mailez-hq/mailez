<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="mailez EZ">
  <defs>
    <linearGradient id="mz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8E6C"/>
      <stop offset="1" stop-color="#2E6E8E"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile background -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#mz-bg)"/>

  <!--
    EZ as one connected letterform, drawn with rounded strokes.
    E: spine + three bars. Z: top bar, diagonal, bottom bar.
    The strokes are arranged so the pair reads as an abstract envelope:
    E's three bars form the top / flap-seam / bottom edges, Z's diagonal
    is the flap fold, and the right side is closed by Z's vertical return.
  -->
  <g fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <!-- E spine -->
    <path d="M136 168 V344"/>
    <!-- E top arm (envelope top edge) -->
    <path d="M136 168 H254"/>
    <!-- E middle arm (flap seam) -->
    <path d="M136 256 H236"/>
    <!-- E bottom arm (envelope bottom edge) -->
    <path d="M136 344 H254"/>
    <!-- Z top bar (continues the top edge) -->
    <path d="M376 168 H254"/>
    <!-- Z diagonal (flap fold) -->
    <path d="M376 168 L254 344"/>
    <!-- Z bottom bar (continues the bottom edge) -->
    <path d="M254 344 H376"/>
    <!-- Z vertical return (closes the right side) -->
    <path d="M376 168 V344"/>
  </g>

  <!-- Small flap hint: a short V crease from the top-center, plus a postmark dot. -->
  <path d="M254 168 L282 236" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.9"/>
  <circle cx="404" cy="230" r="15" fill="#FFD98A"/>
</svg>
