<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="mailez EZ">
  <defs>
    <linearGradient id="mz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8E6C"/>
      <stop offset="1" stop-color="#2E6E8E"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile background -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#mz-bg)"/>

  <!--
    EZ letterforms (same composition as the original lockup icon):
    E on the left (spine + three arms), Z on the right (top arm, diagonal,
    bottom arm). The top and bottom arms line up so the pair reads as an
    open envelope: left edge from E's spine, top/bottom edges from the
    joined arms, the Z diagonal as the flap fold. No extra frame.
  -->
  <g fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <!-- E spine -->
    <path d="M152 196 V376"/>
    <!-- E top arm -->
    <path d="M152 196 H268"/>
    <!-- E middle arm -->
    <path d="M152 286 H246"/>
    <!-- E bottom arm -->
    <path d="M152 376 H268"/>
    <!-- Z top arm -->
    <path d="M408 196 H268"/>
    <!-- Z diagonal -->
    <path d="M408 196 L268 376"/>
    <!-- Z bottom arm -->
    <path d="M268 376 H408"/>
  </g>
  <!-- paper plane swoosh (kept from the original) -->
  <path d="M436 96 L496 60 L474 128 Z" fill="#FFD98A"/>
  <path d="M496 60 L474 128 L458 112 Z" fill="#FFC96B"/>
</svg>
